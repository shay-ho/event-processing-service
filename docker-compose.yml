services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: event_db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.4
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh"
    healthcheck:
      # healthy only after init-sqs.sh created BOTH queues
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name events-queue >/dev/null 2>&1 && awslocal sqs get-queue-url --queue-name events-queue-dlq >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-processing-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - MONGODB_URI=mongodb://mongodb:27017/event_db?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=15000
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
